<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>紫阳县 · 30 米 DEM 三维地形</title>
<style>
  :root {
    --bg: #06090F;
    --panel: rgba(13, 20, 33, 0.72);
    --line: rgba(120, 160, 220, 0.16);
    --text: #E8EEF9;
    --sub: #7E8DA6;
    --accent: #4F8BFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #101A2B 0%, #06090F 62%, #04070B 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }

  /* 左上标题 */
  #title { top: 34px; left: 38px; }
  #title .kick {
    font-size: 11px; letter-spacing: 3px; color: var(--accent);
    text-transform: uppercase; margin-bottom: 10px; font-weight: 600;
  }
  #title h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 2px;
    text-shadow: 0 2px 30px rgba(0,0,0,0.6);
  }
  #title .sub {
    margin-top: 8px; font-size: 12px; color: var(--sub); letter-spacing: 0.6px;
    line-height: 1.7;
  }

  /* 右侧数据 */
  #stats {
    top: 34px; right: 38px; width: 186px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(14px); padding: 16px 16px 14px;
  }
  #stats .row { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; }
  #stats .row + .row { border-top: 1px dashed rgba(120,160,220,0.10); }
  #stats .k { font-size: 11px; color: var(--sub); letter-spacing: 0.5px; }
  #stats .v { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  #stats .v small { font-size: 10px; color: var(--sub); font-weight: 400; margin-left: 2px; }

  /* 左下控制 */
  #panel {
    left: 38px; bottom: 36px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(14px); padding: 15px 17px 14px; width: 268px;
  }
  #panel .lab {
    display: flex; justify-content: space-between; font-size: 11px;
    color: var(--sub); letter-spacing: 0.6px; margin-bottom: 8px;
  }
  #panel .lab b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--p, 40%), rgba(120,160,220,0.22) var(--p, 40%));
    outline: none; margin: 12px 0 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); cursor: pointer;
    box-shadow: 0 0 12px rgba(79,139,255,0.7);
  }
  .chips { display: flex; gap: 6px; margin-top: 16px; }
  .chip {
    flex: 1; padding: 7px 0; text-align: center; font-size: 11.5px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 7px; color: var(--sub);
    background: rgba(255,255,255,0.02); transition: all .18s; letter-spacing: 0.5px;
    user-select: none;
  }
  .chip:hover { color: var(--text); border-color: rgba(120,160,220,0.36); }
  .chip.on { color: #fff; background: rgba(79,139,255,0.18); border-color: rgba(79,139,255,0.55); }

  /* 右下提示 */
  #hint {
    right: 38px; bottom: 38px; font-size: 11px; color: var(--sub);
    letter-spacing: 0.5px; text-align: right; line-height: 1.9;
  }
  #hint span { color: rgba(200,215,240,0.85); }

  /* 悬停 */
  #tip {
    position: fixed; z-index: 20; pointer-events: none; opacity: 0;
    transform: translate(-50%, -140%); transition: opacity .12s;
    background: rgba(9, 15, 26, 0.9); border: 1px solid rgba(79,139,255,0.45);
    border-radius: 8px; padding: 7px 11px; font-size: 11.5px; white-space: nowrap;
    box-shadow: 0 8px 26px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
  }
  #tip b { color: var(--accent); font-size: 13px; font-variant-numeric: tabular-nums; }
  #tip .ll { color: var(--sub); font-size: 10px; margin-top: 2px; letter-spacing: 0.4px; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: #06090F; z-index: 50;
    transition: opacity .5s; font-size: 12px; color: var(--sub); letter-spacing: 2px;
  }
  #loading .bar { width: 160px; height: 2px; background: rgba(120,160,220,0.15); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%);} 100% { transform: translateX(430%);} }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<div id="loading"><div class="bar"><i></i></div><div>正在装配地形网格</div></div>

<div class="hud" id="title">
  <div class="kick">DEM RELIEF · 3D</div>
  <h1 id="ptitle">DEM 三维地形</h1>
  <div class="sub">30 米高程模型 · 真实地形网格<br />Copernicus GLO-30 / 边界裁切</div>
</div>

<div class="hud" id="stats">
  <div class="row"><span class="k">区域面积</span><span class="v" id="s-area">—</span></div>
  <div class="row"><span class="k">高程范围</span><span class="v" id="s-elev">—</span></div>
  <div class="row"><span class="k">高差</span><span class="v" id="s-relief">—</span></div>
  <div class="row"><span class="k">格网</span><span class="v" id="s-grid">—</span></div>
  <div class="row"><span class="k">三角面</span><span class="v" id="s-tris">—</span></div>
</div>

<div class="hud" id="panel">
  <div class="lab"><span>垂直夸张</span><b id="v-exag">×5.0</b></div>
  <input type="range" id="exag" min="1" max="14" step="0.5" value="5" />
  <div class="chips">
    <div class="chip on" data-mode="terrain">分层设色</div>
    <div class="chip" data-mode="ink">冷灰</div>
    <div class="chip" data-mode="brand">钴蓝</div>
  </div>
  <div class="chips" style="margin-top:6px;">
    <div class="chip" id="spin">自动旋转</div>
    <div class="chip" id="reset">重置视角</div>
  </div>
</div>

<div class="hud" id="hint">
  <span>拖拽</span> 旋转 · <span>滚轮</span> 缩放 · <span>右键</span> 平移<br />
  悬停查看点位高程与经纬度
</div>

<div id="tip"><b>0</b> m<div class="ll">—</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

const el = (id) => document.getElementById(id);

/* ---------- 色带 ---------- */
const RAMPS = {
  terrain: [
    [0.00, 0x0B3226], [0.08, 0x1B5236], [0.19, 0x2F6B3C], [0.31, 0x557F3A],
    [0.42, 0x7E8E3B], [0.53, 0x9C9143], [0.64, 0xB08A48], [0.74, 0xA97A52],
    [0.84, 0x9E8076], [0.93, 0xC0B6AC], [1.00, 0xF0ECE5]
  ],
  ink: [
    [0.00, 0x080F1C], [0.18, 0x152538], [0.36, 0x22405E], [0.52, 0x33638E],
    [0.68, 0x4E88B6], [0.82, 0x86B4D6], [0.93, 0xC7DEED], [1.00, 0xF2F8FF]
  ],
  brand: [
    [0.00, 0x041C33], [0.16, 0x062F55], [0.32, 0x0034C6], [0.46, 0x00579E],
    [0.58, 0x00778C], [0.70, 0x1E9E92], [0.82, 0x63C6B4], [0.92, 0xB2E8DC],
    [1.00, 0xFFFFFF]
  ]
};

function hexToLinear(hex) {
  const c = new THREE.Color();
  c.setHex(hex, THREE.SRGBColorSpace);
  return [c.r, c.g, c.b];
}

function rampColor(ramp, t) {
  let i = 0;
  while (i < ramp.length - 2 && t > ramp[i + 1][0]) i++;
  const [t0, c0] = ramp[i], [t1, c1] = ramp[i + 1];
  const f = Math.min(1, Math.max(0, (t - t0) / (t1 - t0 || 1)));
  const a = hexToLinear(c0), b = hexToLinear(c1);
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}

/* ---------- 场景 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06090F, 0.0032);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(34, 46, 66);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(-1, 4, 4);
controls.minDistance = 26;
controls.maxDistance = 340;
controls.maxPolarAngle = Math.PI * 0.492;
controls.autoRotateSpeed = 0.55;

/* ---------- 光照 ---------- */
const sun = new THREE.DirectionalLight(0xfff2dd, 2.55);
sun.position.set(-58, 74, 46);   // 西北偏上，秦巴山区常见的侧逆光
scene.add(sun);

const rim = new THREE.DirectionalLight(0x5B93FF, 0.75);
rim.position.set(62, 34, -54);
scene.add(rim);

const sky = new THREE.HemisphereLight(0x9EC2FF, 0x0A1524, 0.75);
scene.add(sky);

/* ---------- 载入数据 ---------- */
const meta = await fetch('data/terrain_meta.json').then(r => r.json());
// 标题与面积从 meta 读，换县只需重跑导出脚本
document.title = (meta.name || 'DEM') + ' · 30 米 DEM 三维地形';
document.getElementById('ptitle').textContent = meta.name || 'DEM 三维地形';
document.getElementById('s-area').innerHTML =
  (meta.area_km2 ? meta.area_km2.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : '—') + '<small>km²</small>';
const [hBuf, iBuf] = await Promise.all([
  fetch('data/terrain_h.bin').then(r => r.arrayBuffer()),
  fetch('data/terrain_idx.bin').then(r => r.arrayBuffer())
]);

const H = new Float32Array(hBuf);
const IDX = new Uint32Array(iBuf);
const W = meta.grid[0], HG = meta.grid[1];

const pos = new Float32Array(W * HG * 3);
for (let i = 0; i < HG; i++) {
  for (let j = 0; j < W; j++) {
    const k = i * W + j;
    pos[k * 3]     = (j - (W - 1) / 2) * meta.dx_km;
    pos[k * 3 + 1] = Number.isFinite(H[k]) ? (H[k] - meta.min_h) / 1000 : 0;
    pos[k * 3 + 2] = (i - (HG - 1) / 2) * meta.dz_km;
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setIndex(new THREE.BufferAttribute(IDX, 1));
geo.computeVertexNormals();

const colors = new Float32Array(W * HG * 3);
function paint(mode) {
  const ramp = RAMPS[mode] || RAMPS.terrain;
  const rng = meta.max_h - meta.min_h;
  for (let k = 0; k < W * HG; k++) {
    const t = Number.isFinite(H[k]) ? (H[k] - meta.min_h) / rng : 0;
    const c = rampColor(ramp, t);
    colors[k * 3] = c[0]; colors[k * 3 + 1] = c[1]; colors[k * 3 + 2] = c[2];
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
paint('terrain');
geo.attributes.color.needsUpdate = true;

const mat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.93,
  metalness: 0.03,
  flatShading: false,
  envMapIntensity: 0.4
});
const terrain = new THREE.Mesh(geo, mat);
scene.add(terrain);

/* ---------- 底座网格 ---------- */
const grid = new THREE.GridHelper(260, 52, 0x1B3050, 0x101B2C);
grid.position.y = -2.2;
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

/* ---------- 高程立柱（中心点标记） ---------- */
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.45, 20, 16),
  new THREE.MeshBasicMaterial({ color: 0x6FA8FF })
);
marker.visible = false;
scene.add(marker);

/* ---------- 交互 ---------- */
let exag = 5;
const exagEl = el('exag');
function applyExag(v) {
  exag = v;
  terrain.scale.y = v;
  terrain.position.y = 0;
  el('v-exag').textContent = '×' + v.toFixed(1);
  exagEl.style.setProperty('--p', ((v - 1) / 13 * 100) + '%');
}
exagEl.addEventListener('input', e => applyExag(parseFloat(e.target.value)));
applyExag(5);

document.querySelectorAll('.chip[data-mode]').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-mode]').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    paint(c.dataset.mode);
    geo.attributes.color.needsUpdate = true;
  });
});

const spinBtn = el('spin');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.classList.toggle('on', controls.autoRotate);
});
el('reset').addEventListener('click', () => {
  controls.autoRotate = false; spinBtn.classList.remove('on');
  camera.position.set(34, 46, 66);
  controls.target.set(-1, 4, 4);
  applyExag(5); exagEl.value = 5;
});

/* 悬停取高程 */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tip = el('tip');
let lastHover = 0, dragging = false;
renderer.domElement.addEventListener('pointerdown', () => dragging = true);
window.addEventListener('pointerup', () => dragging = false);

renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) { tip.style.opacity = 0; return; }
  const now = performance.now();
  if (now - lastHover < 90) return;
  lastHover = now;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(terrain, false)[0];

  if (hit) {
    const wx = hit.point.x / meta.dx_km + (W - 1) / 2;
    const wz = hit.point.z / meta.dz_km + (HG - 1) / 2;
    const elev = meta.min_h + hit.point.y / terrain.scale.y * 1000;
    const lon = meta.bounds[0] + wx * (meta.bounds[2] - meta.bounds[0]) / (W - 1);
    const lat = meta.bounds[3] - wz * (meta.bounds[3] - meta.bounds[1]) / (HG - 1);
    tip.querySelector('b').textContent = Math.round(elev);
    tip.querySelector('.ll').textContent = lon.toFixed(4) + '°E  ' + lat.toFixed(4) + '°N';
    tip.style.left = e.clientX + 'px';
    tip.style.top = e.clientY + 'px';
    tip.style.opacity = 1;
    marker.visible = true;
    marker.position.copy(hit.point);
  } else {
    tip.style.opacity = 0;
    marker.visible = false;
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  tip.style.opacity = 0; marker.visible = false;
});

/* ---------- 数据面板 ---------- */
el('s-elev').textContent = meta.min_h + '–' + meta.max_h;
el('s-relief').innerHTML = Math.round(meta.max_h - meta.min_h) + '<small>m</small>';
el('s-grid').innerHTML = meta.grid[0] + '×' + meta.grid[1];
el('s-tris').innerHTML = (meta.tris / 10000).toFixed(1) + '<small>万</small>';

/* ---------- 渲染循环 ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();

el('loading').classList.add('hide');
setTimeout(() => el('loading').remove(), 600);
</script>
</body>
</html>
